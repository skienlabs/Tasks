name: Build & Deploy Tasks Web

# Same flow as the other apps: build image, push to GAR, SSH to the VM, pull and restart.
# Uses the same secrets: GCP_SA_KEY, GCP_PROJECT_ID, VM_HOST, VM_USER, VM_SSH_KEY.
on:
  workflow_dispatch:

env:
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/test-images/tasks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server tests
        working-directory: web/server
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Client build
        working-directory: web/client
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Authenticate to GCP
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Configure Docker
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build image (client and server are built inside Docker)
      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            web

      # Push image (latest + commit sha, so you can roll back)
      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # Deploy to VM
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 2232
          script: |
            set -e
            export PATH="$HOME/google-cloud-sdk/bin:$PATH"
            cd ~/docker/apps/tasks
            docker compose pull
            docker compose up -d
            docker image prune -f
