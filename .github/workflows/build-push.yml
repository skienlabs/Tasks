name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed only for Workload Identity Federation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Configure in GitHub: Settings > Secrets and variables > Actions
#   Variables: GAR_LOCATION (e.g. asia-south1), GCP_PROJECT_ID, GAR_REPOSITORY
#   Auth, pick ONE:
#     a) Variables GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT  (recommended, keyless)
#     b) Secret GCP_SA_KEY (service-account JSON key with Artifact Registry Writer)
# Until these are set, the workflow still runs tests and builds the image, but does not push.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Web build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide image name and whether to push
        id: cfg
        run: |
          if [ -n "$GAR_LOCATION" ] && [ -n "$GCP_PROJECT_ID" ] && [ -n "$GAR_REPOSITORY" ] \
             && { [ -n "$WIF_PROVIDER" ] || [ "$HAS_SA_KEY" = "true" ]; } \
             && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "image=${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/tasks" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "image=tasks" >> "$GITHUB_OUTPUT"
            echo "::notice::Image will be built but not pushed (GAR settings not configured, or this is a pull request)."
          fi

      - name: Authenticate to Google Cloud (Workload Identity)
        if: steps.cfg.outputs.push == 'true' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service-account key)
        if: steps.cfg.outputs.push == 'true' && env.WIF_PROVIDER == '' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Artifact Registry
        if: steps.cfg.outputs.push == 'true'
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.cfg.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
