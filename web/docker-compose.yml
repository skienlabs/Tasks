# Goes on the VM as ~/docker/apps/tasks/docker-compose.yml
# Next to it: config/firebase-config.json (Firebase web app config, chmod 644).
# Your reverse proxy on skiensuite-net reaches the app at http://tasks:8080
networks:
  skiensuite-net:
    name: skiensuite-net
    external: true

services:
  tasks:
    image: us-central1-docker.pkg.dev/inspired-verve-293514/test-images/tasks:latest
    container_name: tasks
    restart: unless-stopped
    networks:
      - skiensuite-net
    volumes:
      - tasks-data:/data
      - ./config/firebase-config.json:/config/firebase-config.json:ro
    mem_limit: 256m
    # Optional: limit who can use the app (comma separated, "@domain.com" for a whole domain).
    # environment:
    #   ALLOWED_EMAILS: you@gmail.com

volumes:
  tasks-data:
