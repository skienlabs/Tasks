# Copy this file to the VM as ~/docker/apps/tasks/docker-compose.yml
# Next to it:
#   .env                         ->  GCP_PROJECT_ID=your-project-id   (and optionally ALLOWED_EMAILS, TASKS_PORT)
#   config/firebase-config.json  ->  Firebase web app config (chmod 644)
# The "Build & Deploy Tasks Web" workflow then runs `docker compose pull && docker compose up -d` here.
services:
  tasks:
    image: us-central1-docker.pkg.dev/${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in .env}/test-images/tasks:latest
    container_name: tasks
    restart: unless-stopped
    ports:
      - "${TASKS_PORT:-8080}:8080"
    environment:
      # Only these Google accounts may sign in (comma separated, "@domain.com" allows a domain).
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - tasks-data:/data
      - ./config/firebase-config.json:/config/firebase-config.json:ro
    mem_limit: 256m

volumes:
  tasks-data:
