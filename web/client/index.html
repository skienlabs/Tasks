<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Tasks - plan each day and get things done." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tasks</title>
    <script>
      // Paint the right background before the app loads (no white flash in dark mode).
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('tasks.theme'); } catch (e) {}
        var BG = { light: '#ffffff', gray: '#1f1f1f', dim: '#131314', dark: '#000000', abyss: '#000c18', mono: '#000000', monoLight: '#ffffff' };
        if (!BG[pref]) pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var bg = BG[pref];
        var dark = !(pref === 'light' || pref === 'monoLight');
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
