services:
  tasks:
    image: ${TASKS_IMAGE:-tasks:latest}
    build: .
    container_name: tasks
    restart: unless-stopped
    ports:
      - "${TASKS_PORT:-8080}:8080"
    environment:
      # Optional: only these Google accounts may sign in (comma separated).
      # Use "@example.com" to allow a whole domain. Leave empty to allow anyone.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - tasks-data:/data
      - ./config/firebase-config.json:/config/firebase-config.json:ro
    mem_limit: 256m

volumes:
  tasks-data:
